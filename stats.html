  <title>Statistics</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      margin: 30px;
      text-align: center;
      line-height: 1.6;
    }

    h1 {
      font-size: 36px;
    }

    h2 {
      margin-top: 40px;
    }

    p {
      max-width: 1000px;
      margin: 10px auto;
      font-size: 18px;
      text-align: justify;
    }

    a {
      text-decoration: none;
      font-size: 18px;
    }

    .section {
      margin: 50px auto;
    }

    .button {
      display: inline-block;
      padding: 12px 28px;
      font-size: 20px;
      border-radius: 8px;
      color: white;
      background-color: #0070ba;
      transition: background-color 0.3s ease;
      margin: 5px;
      min-width: 150px;
    }

    .button:hover {
      background-color: #005c99;
    }

    hr {
      border: none;
      height: 1px;
      background-color: #ccc;
      margin: 60px auto;
      width: 80%;
    }

    table {
      border-collapse: collapse;
      border: 4px solid #000;
      width: 100%;
      font-family: sans-serif;
      margin: 0 auto; 
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px 16px;
      text-align: center; 
    }

    th h3 {
      font-size: 18px;
      margin: 0;
      color: white;
    }

    th h2 {
      font-size: 14px;
      margin: 0;
      color: white;
    }

    tr:hover {
      background-color: #f2f2f2;
    }

    th {
      background-color: #0070ba;
    }

    td:nth-child(2) {
      font-weight: bold;
    }

    .table-container {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch; 
      max-width: 100%;
      margin: 0 auto; 
    }

    .default-table table,
    .default-table table th,
    .default-table table td {
      font-size: 16px;
      font-weight: normal; 
    }

    .default-table thead tr:first-child th {    
      font-weight: normal;  
      color: revert;           
      background-color: revert; 
    }

    .default-table tbody tr:first-child td {
      font-weight: normal;  
    }

    .default-table table {
      width: auto !important;  
      max-width: 900px;         
      margin: 0 auto;           
      display: table;          
    }

    .default-table caption {
      caption-side: top;
      text-align: center;
      font-weight: bold;
      padding-bottom: 8px;
    }
    .default-table caption {
      caption-side: top;
      text-align: center;
      font-weight: bold;
      padding-bottom: 8px;
      white-space: nowrap;   
    }
    .hover-thumb {
    position: relative;
    cursor: help;
    }

    .hover-thumb img {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    width: 500px; 
    border: 2px solid #333;
    background: #fff;
    padding: 4px;
    z-index: 10;
    }

    .hover-thumb:hover img {
      display: block;
      }

      .general-stats {
    max-width: 900px;
    margin: 0 auto;
    padding: 0;
    list-style: none;
    text-align: left;
  }

  .general-stats > li {
    display: flex;
    justify-content: space-between;
    padding: 6px 8px;
    border-bottom: 1px solid #ddd;
  }

  .general-stats .label {
    flex: 1;
  }

  .general-stats .value {
    font-weight: bold;
    margin-left: 20px;
  }

  .general-stats .sub {
    padding-left: 32px;
    font-size: 0.95em;
    color: #555;
  }

  .general-stats > li:not(.sub) {
    background-color: #f2f2f2;
    font-weight: 600;
  }

  .general-stats > li.sub {
    background-color: transparent;
  }

  </style>
