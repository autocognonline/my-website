from supabase import create_client
import os
import json

SUPABASE_URL = os.environ["SUPABASE_URL"]
SUPABASE_SERVICE_KEY = os.environ["SUPABASE_SERVICE_KEY"]
supabase = create_client(SUPABASE_URL, SUPABASE_SERVICE_KEY)


# ────────────────────────────────────────────────
# 2. Get finished NOFRAT entries
# ────────────────────────────────────────────────
noais2_res = (
    supabase.table("nocis_global")
    .select("email, score, end")
    .eq("leaderboard", True)
    .execute()
)

auth_res = (
    supabase.table("nocis_auth")
    .select("email, name")
    .execute()
)
auth_res2 = (
    supabase.table("auth")
    .select("email, name")
    .execute()
)

# ────────────────────────────────────────────────
# 3. Combine only people present in BOTH
# ────────────────────────────────────────────────
combined = []

for row in noais2_res.data:
    email = row.get("email")
    if not email:
        continue

    if email not in ovat_by_email:
        continue  # must exist in both

    ovat = ovat_by_email[email]

    total_score = (row.get("score") or 0) + (ovat["score"] or 0)
    total_attempts = (row.get("attempts") or 0) + (ovat["attempts"] or 0)

    # Prefer name from NOFRAT if available, otherwise OVAT
    name = row.get("name")

    combined.append({
        "email": email,
        "name": name,
        "total_score": total_score,
        "total_attempts": total_attempts
    })

# ────────────────────────────────────────────────
# 4. Sort: highest score first, then lowest attempts
# ────────────────────────────────────────────────
combined.sort(
    key=lambda x: (-x["total_score"])
)

# ────────────────────────────────────────────────
# 5. Load norm data (for converting total score → IQ)
# ────────────────────────────────────────────────
norm_file_bytes = supabase.storage.from_("public").download("noais2_norm/norm.json")
normnviq_file_bytes = supabase.storage.from_("public").download("noais2_norm/norm_nviq.json")
norm_data = json.loads(norm_file_bytes.decode("utf-8"))
norm_data_nviq = json.loads(normnviq_file_bytes.decode("utf-8"))

def score_to_iq(score):
    if score is None or score <= 0:
        return "N/A"
    iq = norm_data.get(str(score), "N/A")
    if score == 115 and iq != "N/A":
        return f"≥ {iq}"
    return iq

# ────────────────────────────────────────────────
# 6. Build HTML rows
# ────────────────────────────────────────────────
rows_html = ""
for idx, entry in enumerate(combined):
    iq = score_to_iq(entry["total_score"])
    rows_html += (
        f"<tr>"
        f"<td>{idx + 1}</td>"
        f"<td>{entry['name']}</td>"
        f"<td>{entry['total_score']}</td>"
        f"<td>{round(iq)}</td>"
        f"</tr>\n"
    )

