create table public.auth (
  email text not null,
  date date not null,
  allowed boolean not null default false,
  threat smallint not null default '0'::smallint,
  name text null,
  ip text null,
  constraint Auth_pkey primary key (email)
) TABLESPACE pg_default;

create table public.nocis_global (
  email text not null,
  score integer null,
  leaderboard boolean not null default false,
  start timestamp with time zone null default now(),
  attempts_s json null,
  finished_s boolean not null default false,
  pwd text null,
  "end" timestamp with time zone null,
  attempt_n smallint not null default 3,
  attempt_v smallint null default 3,
  solved_ids_spatial json null,
  solved_ids_numerical json null,
  solved_ids_verbal json null,
  solved_ids_logical json null,
  solved_ids_abstract json null,
  certificate boolean null default false,
  finished_a boolean null default false,
  finished_l boolean null default false,
  attempts_a json null default '[3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3]'::json,
  attempts_l json null default '[3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3]'::json,
  constraint nocis_global_pkey primary key (email)
) TABLESPACE pg_default;

create table public.nocis_auth (
  email text not null,
  date date not null,
  name text null,
  ip text null,
  allowed_spatial boolean not null default false,
  allowed_verbal boolean not null default false,
  allowed_numerical boolean not null default false,
  allowed_logical boolean not null default false,
  allowed_abstract boolean not null default false,
  code text null,
  email_verified boolean not null default false,
  constraint nocis_auth_pkey primary key (email)
) TABLESPACE pg_default;


name: Update NOAIS2 Leaderboard

on:
  schedule:
    - cron: "0 0 */2 * *" 
  workflow_dispatch:      # manual run button

permissions:
  contents: write

concurrency:
  group: leaderboard-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # fetch full history

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3️⃣ Install Supabase Client
      - name: Install Supabase Client
        run: pip install supabase

      # 4️⃣ Generate leaderboard
      - name: Generate leaderboard noais
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python generate_noais2leaderboard.py

      # 5️⃣ Commit and push changes (if any) directly to main
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add noais2leaderboard.html

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update NOAIS2 leaderboard"
            git push

          fi
