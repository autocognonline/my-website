name: Update contributor leaderboard

on:
  schedule:
    - cron: "0 5 */5 * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install supabase

      - name: Run script
        env:
          SUPABASE_URL_2: ${{ secrets.SUPABASE_URL_2 }}
          SUPABASE_SERVICE_KEY_2: ${{ secrets.SUPABASE_SERVICE_KEY_2 }}
        run: |
          python generate_contributor_leaderboard.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add contributorLeaderboard.html

          git diff --cached --quiet || git commit -m "Auto-update contributor leaderboard"
          git push
