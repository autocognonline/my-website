name: Update contributor leaderboard

on:
  schedule:
    - cron: "0 11 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase

      - name: Run script
        env:
          SUPABASE_URL_2: ${{ secrets.SUPABASE_URL_2 }}
          SUPABASE_SERVICE_KEY_2: ${{ secrets.SUPABASE_SERVICE_KEY_2 }}
        run: |
          python generate_contributor_leaderboard.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add contributorLeaderboard.html

          if ! git diff --cached --quiet; then
            git commit -m "Auto-update contributor leaderboard [skip ci]"
            git push
          fi
