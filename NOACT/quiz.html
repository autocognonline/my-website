<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NOACT</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

  <h1 style="text-align:center;">Nydegger Online Automatic Cognitive Test</h1>

  <section id="gameSection">

    <div class="top-bar">
      <span id="scoreEl">Score: 0</span>
      <span id="attemptsEl">Attempts left: 0</span>
    </div>

    <div class="question-container">
      <img id="questionImg" alt="Loading question...">
    </div>

    <div class="question-navigation">
      <button id="prevBtn">Previous</button>
      <button id="nextBtn">Next</button>
    </div>

    <div class="answer-container">
      <input id="answerInput" type="text" placeholder="Your answer...">
      <button id="submitBtn">Submit</button>
    </div>

    <div style="text-align:center; margin-top:20px;">
      <button id="darkModeBtn">Dark Mode</button>
      <button id="finishBtn" type="button">End Test</button>
    </div>

    <p id="status"></p>
    <a href="2voazrmfc093nsd7vl.pdf">Items pdf</a>
  </section>
</div>

<script src="quiz.js?v=8"></script>
</body>
</html>
